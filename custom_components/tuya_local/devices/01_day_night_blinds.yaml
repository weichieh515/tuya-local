name: Day and night blinds
entities:
  - entity: cover
    name: Day
    icon: mdi:weather-sunny
    class: blind
    dps:
      - id: 1
        name: control
        type: string
        optional: true
        mapping:
          - dps_val: open
            value: open
          - dps_val: close
            value: close
          - dps_val: stop
            value: stop
      - id: 2
        type: integer
        name: position
        range:
          min: 0
          max: 100
        mapping:
          - invert: true
      - id: 3
        type: integer
        name: current_position
        range:
          min: 0
          max: 100
        mapping:
          - invert: true
  - entity: cover
    name: Night
    icon: mdi:weather-night
    class: blind
    dps:
      - id: 100
        name: control
        type: string
        optional: true
        mapping:
          - dps_val: open
            value: open
          - dps_val: close
            value: close
          - dps_val: stop
            value: stop
      - id: 101
        type: integer
        name: position
        range:
          min: 0
          max: 100
        mapping:
          - invert: true
      - id: 101
        type: integer
        name: current_position
        range:
          min: 0
          max: 100
        mapping:
          - invert: true
